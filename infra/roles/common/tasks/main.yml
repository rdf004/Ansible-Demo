---
# ── Base packages and directory structure ───────
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [common]

- name: Install base packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - rsync
      - curl
      - git
      - acl
      - coreutils
    state: present
  tags: [common]

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present
  tags: [common]

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_base_dir }}"
    create_home: false
  tags: [common]

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  loop:
    - "{{ app_base_dir }}"
    - "{{ releases_dir }}"
    - "{{ shared_dir }}"
    - "{{ backup_dir }}"
  tags: [common]

- name: Create log directory
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  tags: [common]

- name: Create new release directory
  ansible.builtin.file:
    path: "{{ release_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  tags: [common]

- name: Template shared environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ shared_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  tags: [common]
