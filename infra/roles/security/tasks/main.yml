---
- name: Configure UFW defaults (incoming deny)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  tags: [security]

- name: Allow outgoing traffic
  community.general.ufw:
    policy: allow
    direction: outgoing
  tags: [security]

- name: Allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ firewall_allowed_ports }}"
  tags: [security]

- name: Deploy SSH hardening config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd
  when: ssh_hardening_enabled | default(false) | bool
  tags: [security]

# Probe-then-fix so changed_when actually reflects whether
# anything got mutated. Previous version was unconditionally
# `changed_when: false`, which masked drift in CI/idempotency
# tests — every chmod ran but every task always reported "ok".
- name: Find world-readable files in app directory
  ansible.builtin.command:
    argv:
      - find
      - "{{ app_base_dir }}"
      - -perm
      - -o+r
      - -type
      - f
  register: world_readable_files
  changed_when: false
  tags: [security]

- name: Strip world-read bit from app files
  ansible.builtin.command:
    argv:
      - find
      - "{{ app_base_dir }}"
      - -perm
      - -o+r
      - -type
      - f
      - -exec
      - chmod
      - o-r
      - "{}"
      - +
  when: world_readable_files.stdout | trim != ""
  changed_when: world_readable_files.stdout | trim != ""
  tags: [security]

- name: Find world-traversable directories in app directory
  ansible.builtin.command:
    argv:
      - find
      - "{{ app_base_dir }}"
      - -perm
      - -o+rx
      - -type
      - d
  register: world_readable_dirs
  changed_when: false
  tags: [security]

- name: Strip world-rx bits from app directories
  ansible.builtin.command:
    argv:
      - find
      - "{{ app_base_dir }}"
      - -perm
      - -o+rx
      - -type
      - d
      - -exec
      - chmod
      - o-rx
      - "{}"
      - +
  when: world_readable_dirs.stdout | trim != ""
  changed_when: world_readable_dirs.stdout | trim != ""
  tags: [security]
