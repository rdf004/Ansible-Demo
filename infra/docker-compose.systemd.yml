version: "3.8"

# Systemd-as-PID1 target for end-to-end testing of the Ansible
# deployment. Use the original docker-compose.yml for the lighter
# sshd-only target.
services:
  target-systemd:
    build:
      context: .
      dockerfile: Dockerfile.target.systemd
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2222:22"
      - "8080:80"
